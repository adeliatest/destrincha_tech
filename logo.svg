<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="12" y1="6" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="8" y1="22" x2="30" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="34" y1="22" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded container -->
  <rect width="64" height="64" rx="16" fill="#0b1324" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Deconstructed Isometric Cube ("Cubo Destrinchado") -->
  <g filter="url(#glow)">
    <!-- Top Face (Floating slightly up to show it being 'unpacked/destrinchado') -->
    <polygon
      points="32,8 51,19 32,30 13,19"
      fill="url(#topGrad)"
      stroke="#bae6fd"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Left Face (Shifted slightly left & down) -->
    <polygon
      points="11,23 30,34 30,55 11,44"
      fill="url(#leftGrad)"
      stroke="#60a5fa"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Right Face (Shifted slightly right & down) -->
    <polygon
      points="34,34 53,23 53,44 34,55"
      fill="url(#rightGrad)"
      stroke="#38bdf8"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Glowing core dot in the center gap -->
    <circle cx="32" cy="32" r="2.2" fill="#e0f2fe" />
  </g>
</svg>
